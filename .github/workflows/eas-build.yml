# Lane 3: a store release, started only by pushing a version tag.
#
#   1. Bump "version" in app.json (in the PR, the Native Check comment reminds you)
#   2. Merge, then on main:  git tag v1.1.0 && git push --tags
#   3. This builds iOS and Android and submits exactly those builds to the stores
#      (App Store Connect / Play internal track). Going public is still your click there.
#   4. It also builds a preview binary of the same version for tester phones, so
#      Lane 2 updates for this version have somewhere to land.
#
# A merge to main never builds a binary. Manual runs stay available for one-off builds.

name: EAS Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]
      profile:
        description: 'Build profile (production here builds without submitting)'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]

# One release at a time: a second tag waits instead of racing the first
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Store release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches app.json
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version $VERSION. Expected v$VERSION."
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Google Service Account JSON
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      # --auto-submit submits the build this command made, never "the latest build on EAS"
      - name: Build and submit to the stores
        run: eas build --platform all --profile production --auto-submit --non-interactive

      - name: Build the matching tester binary
        run: eas build --platform all --profile preview --non-interactive --no-wait

  manual:
    name: Manual build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
