# EAS Submit Workflow
# Automatically submits production builds to App Store and Play Store

name: EAS Submit

on:
  workflow_run:
    workflows: ["EAS Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to submit'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    # Only run if the build workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    # Needed to push the release tag at the end of the job.
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A workflow_run checkout defaults to the default branch HEAD, which may
          # already be ahead of the commit that produced the build being submitted.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Create Google Service Account file from secret
      - name: Create Google Service Account JSON
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      # Submit iOS to TestFlight (internal TestFlight first)
      - name: Submit iOS to TestFlight
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'all'))
        run: eas submit --platform ios --profile production --latest --non-interactive

      # Submit Android to Play Store (internal testing track)
      - name: Submit Android to Play Store
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'android' || inputs.platform == 'all'))
        run: eas submit --platform android --profile production --latest --non-interactive

      # Tag the commit that is now in the stores, so a later hotfix can branch
      # from the exact code users are running and ship an OTA to that runtime
      # version. Only on the workflow_run path: a manual dispatch submits
      # `--latest`, which is not necessarily this commit.
      - name: Tag the released version
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Leaving it pointing at the first build of this version."
            echo "Bump the version in app.json before the next store release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "Submitted to App Store and Play Store (run ${{ github.run_id }})"
          git push origin "$TAG"
          echo "Tagged $TAG at $RELEASE_SHA"
