# Lane 2, step 1: every merge to main sends the JS update to TESTERS only.
#
# Testers are phones running a "preview" build (channel: preview). Store users run the
# "production" build (channel: production) and get nothing from this workflow.
# When the update looks good on a tester phone, run "EAS Promote" to send the exact
# same update to everyone.
#
# Guard: runtimeVersion follows the app.json version (policy "appVersion"). If no
# preview build has that version, no tester phone can receive the update, so the run
# fails and tells you to build one. That usually means a native release is pending.

name: EAS Update

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish to testers (preview)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check a tester build can receive this update
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          for PLATFORM in ios android; do
            # A failed command must fail the run, never read as "no builds yet".
            # build:list leaves runtimeVersion empty; with the appVersion policy the two are equal.
            RUNTIME=$(eas build:list --channel preview --platform "$PLATFORM" --status finished \
              --limit 1 --json --non-interactive | node -p "const b = JSON.parse(require('fs').readFileSync(0))[0]; b?.runtimeVersion || b?.appVersion || ''")
            if [ "$RUNTIME" != "$VERSION" ]; then
              echo "::error::No $PLATFORM preview build has version $VERSION (latest is '${RUNTIME:-none}')."
              echo "Tester phones cannot receive this update. Build one: Actions > EAS Build > profile preview."
              exit 1
            fi
            echo "$PLATFORM: preview build $RUNTIME matches app.json $VERSION"
          done

      - name: Publish to testers
        run: eas update --branch preview --environment preview --message "${{ github.event.head_commit.message || 'Manual update' }}" --non-interactive

      # EAS Build uploads source maps for the native bundle. An OTA ships a
      # different bundle, so without this a JS crash in an update shows minified
      # frames. `eas update` leaves the bundles and maps in dist; org and project
      # come from the Sentry plugin block in app.json.
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist
