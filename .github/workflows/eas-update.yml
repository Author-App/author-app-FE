# Lane 2, step 1: every merge to main sends the JS update to TESTERS only.
#
# Testers are phones running a "preview" build (channel: preview). Store users run the
# "production" build (channel: production) and get nothing from this workflow.
# When the update looks good on a tester phone, run "EAS Promote" to send the exact
# same update to everyone.
#
# Guard: runtimeVersion follows the app.json version (policy "appVersion"). If no
# preview build has that version, no tester phone can receive the update, so the run
# fails and tells you to build one. That usually means a native release is pending.

name: EAS Update

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish to testers (preview)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check a tester build can receive this update
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          for PLATFORM in ios android; do
            # Any preview build of this version, not only the newest: a hotfix branch for an
            # older version must still find its build. A failed command fails the run.
            FOUND=$(eas build:list --channel preview --platform "$PLATFORM" --status finished \
              --app-version "$VERSION" --limit 1 --json --non-interactive | node -p "JSON.parse(require('fs').readFileSync(0)).length")
            if [ "$FOUND" = "0" ]; then
              echo "::error::No $PLATFORM preview build has version $VERSION."
              echo "Tester phones cannot receive this update. Build one: Actions > EAS Build > profile preview."
              exit 1
            fi
            echo "$PLATFORM: a preview build with version $VERSION exists"
          done

      - name: Publish to testers
        run: eas update --branch preview --environment preview --message "${{ github.event.head_commit.message || 'Manual update' }}" --non-interactive
