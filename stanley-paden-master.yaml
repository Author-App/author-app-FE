claim_boundary:
  can_claim:
    - Built the app solo and shipped it to both stores personally; 97.4% of the
      current TypeScript is mine by git blame
    - Built the release pipeline and can walk through every stage of it
    - Handled Apple and Google review, including a rejection and its fix
    - Set up the entire test suite and the Detox E2E runner from nothing
    - Designed the app. No designs were supplied; the visual language, colour and
      type system, screen layouts, information architecture, and the reader and
      player interfaces were mine, proposed to the client and approved
  cannot_claim:
    - The backend. It was consumed, not built. Stripe webhooks, the order state
      machine, the Lulu print integration and signed-URL generation are all server side
    - In-app purchases. The subscription screen is UI only, with RevenueCat pending;
      nothing is charged through it
    - Scale or traffic; a single-author audience, not a high-volume app
    - Content and roadmap decisions, which sat with the client, meaning what gets published
      and which features exist. The design of all of it is mine
    - Any production metric. No DAU, crash-free rate or latency figure exists outside
      Sentry, and none has been pulled
  required_qualifiers:
    - 'The 30 minute figure is the native build only, not time to reach users;
      store review adds days on Apple and hours on Google'
    - 'Coverage is about 20% of statements by design: the suite targets the data
      layer, auth and the home feed rather than the whole app'
    - 'One E2E flow, iOS simulator only; Android E2E is configured but not enabled yet'
    - 'The CMS is a separate codebase and is not shown in this repo'
unverified:
  - 'Whether the nightly Detox workflow has ever completed green on a GitHub macOS
    runner. The workflow is written and correct on reading; the run history has not
    been checked'
